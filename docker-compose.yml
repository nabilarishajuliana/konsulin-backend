x-app: &app
  build: .
  image: konsulin-backend:local
  restart: unless-stopped
  environment:
    APP_PORT: "3000"
    LOG_LEVEL: info
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: postgres
    DB_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    DB_NAME: konsulin
    DB_SSLMODE: disable
    DB_MAX_CONNS: "10"
    JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
    JWT_ISSUER: konsulin
    JWT_ACCESS_TTL_MINUTES: "15"
    JWT_REFRESH_TTL_DAYS: "7"
    MONGO_URI: mongodb://mongo:27017
    MONGO_DATABASE: konsulin
    REDIS_ADDR: redis:6379
    SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    command: ["-role=api"]
    ports:
      - "8080:3000"

  worker:
    <<: *app
    command: ["-role=worker"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
      POSTGRES_DB: konsulin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d konsulin"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  mongodata:
  redisdata: